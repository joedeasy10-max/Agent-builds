name: RAG Evaluation

# Gate for the govuk-rag-eval subproject. The project lives under
# govuk-rag-eval/, so `run:` steps use that as their working directory and the
# repo-root-relative paths (cache, hashFiles, git show, github-script,
# upload-artifact) are prefixed explicitly.
#
# The whole pipeline is guarded on an LLM provider key (OPENAI_API_KEY or
# ANTHROPIC_API_KEY — interchangeable) being configured: without either, every
# real step is skipped and the job passes with a notice, so this never becomes a
# red check on a repo that has not opted in. It activates once a key is set and a
# real corpus + golden set exist (build step 3).

on:
  pull_request:
    paths:
      - "govuk-rag-eval/src/**"
      - "govuk-rag-eval/configs/**"
      - "govuk-rag-eval/data/golden/**"
      - "govuk-rag-eval/requirements*.lock"
      - ".github/workflows/rag-eval.yml"
  schedule:
    # Nightly full run, including the expensive LLM-judge metrics
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: rag-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: govuk-rag-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Judge metrics are slow + cost money. Only run the full suite nightly,
      # on manual dispatch, or when a PR carries the `full-eval` label.
      RUN_JUDGE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-eval') }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The gate needs an LLM provider key (OpenAI or Anthropic — the providers
      # are interchangeable). Without either, skip every real step so the job
      # stays green until the repo opts in (see header).
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Need main's baseline metrics for the delta comparison
          fetch-depth: 0

      - name: Gate inactive notice
        if: env.HAS_KEY != 'true'
        run: |
          echo "No LLM provider key (OPENAI_API_KEY / ANTHROPIC_API_KEY) — RAG eval gate is inactive."
          echo "Set a key and commit a baseline to activate (see govuk-rag-eval/results/README.md)."

      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: pip install -r requirements.lock

      # The index is deterministic given the corpus + retrieval config, so
      # key the cache on both. A config change correctly forces a rebuild.
      #
      # restore/save are split deliberately. The combined `actions/cache` action
      # only saves in post-job cleanup *when the job succeeds*, so a failure in a
      # later step (the judge, typically) threw away a perfectly good index and
      # the next run paid ~10 minutes to rebuild it. The index's validity does
      # not depend on whether grading afterwards worked.
      - name: Restore vector index
        id: index-cache
        if: env.HAS_KEY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: govuk-rag-eval/.index/
          key: index-${{ hashFiles('govuk-rag-eval/configs/retrieval.yaml', 'govuk-rag-eval/data/corpus/manifest.json') }}

      - name: Build index
        if: env.HAS_KEY == 'true' && steps.index-cache.outputs.cache-hit != 'true'
        run: python -m src.ingest --config configs/retrieval.yaml --out .index/

      # Saved immediately, before anything that can fail downstream.
      - name: Save vector index
        if: env.HAS_KEY == 'true' && steps.index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: govuk-rag-eval/.index/
          key: index-${{ hashFiles('govuk-rag-eval/configs/retrieval.yaml', 'govuk-rag-eval/data/corpus/manifest.json') }}

      - name: Run retrieval evaluation (deterministic, always)
        if: env.HAS_KEY == 'true'
        run: |
          python -m src.evaluate \
            --suite retrieval \
            --dataset data/golden/questions.jsonl \
            --config configs/retrieval.yaml \
            --index .index/ \
            --out results/current.json

      - name: Run judge evaluation (RAGAS)
        if: env.HAS_KEY == 'true' && env.RUN_JUDGE == 'true'
        # Backstop only; bounded retries and the pre-flight check are the real
        # fix. A judge step that eats the whole 30-minute job budget also takes
        # the compare and artefact steps down with it, which is how run
        # 34486989558 produced no report at all.
        timeout-minutes: 20
        env:
          # RAGAS phones home to t.explodinggradients.com on import and during
          # evaluation. On a locked-down runner that call hangs rather than
          # failing fast, which shows up as unexplained TimeoutError on samples
          # that were otherwise fine. Nothing here needs telemetry.
          RAGAS_DO_NOT_TRACK: "true"
        run: |
          pip install -r requirements-judge.lock
          python -m src.evaluate \
            --suite judge \
            --dataset data/golden/questions.jsonl \
            --config configs/retrieval.yaml \
            --index .index/ \
            --judge-backend ragas \
            --runs 3 \
            --merge-into results/current.json

      # Which questions failed, not just how many. results/current.json carries
      # per_question detail with first_relevant_rank, but it only ever reaches an
      # artefact — and an artefact download that some networks block is no use
      # when you are trying to work out why six questions miss.
      - name: Report retrieval misses
        if: env.HAS_KEY == 'true' && always()
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path("results/current.json")
          if not f.exists():
              print("no results/current.json — retrieval did not run")
              raise SystemExit(0)
          d = json.loads(f.read_text())
          rows = d.get("retrieval_detail", {}).get("per_question", [])
          if not rows:
              print("no per-question detail in results")
              raise SystemExit(0)
          misses = [r for r in rows if not r.get("hit_at_5")]
          print(f"{len(rows)} answerable · {len(rows)-len(misses)} hit@5 · {len(misses)} missed\n")
          for r in sorted(misses, key=lambda r: (r.get("first_relevant_rank") or 10**6)):
              rank = r.get("first_relevant_rank")
              where = f"found at rank {rank}" if rank else "NOT in the retrieved list at all"
              print(f"  {r['id']}  [{r.get('difficulty','?')}]  {where}")
              for e in r.get("expected", []):
                  print(f"      expected : {e}")
              for i, got in enumerate(r.get("retrieved", [])[:5], start=1):
                  print(f"      rank {i}   : {got}")
              print()
          deep = [r for r in misses if r.get("first_relevant_rank")]
          print(f"\nnear-misses recoverable by depth: {len(deep)}")
          print(f"hard misses (absent from the whole list): {len(misses)-len(deep)}")
          PY

      - name: Fetch baseline from main
        if: env.HAS_KEY == 'true'
        run: |
          git show origin/${{ github.base_ref || 'main' }}:govuk-rag-eval/results/baseline.json > results/baseline.json \
            || echo '{}' > results/baseline.json

      - name: Compare against baseline
        id: compare
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        run: |
          python scripts/compare.py \
            --current results/current.json \
            --baseline results/baseline.json \
            --thresholds configs/eval_config.yaml \
            --markdown results/report.md

      - name: Comment on PR
        # always() so a failing gate still posts its table — but only when the
        # report actually exists, else this masks the real error with an ENOENT.
        if: always() && env.HAS_KEY == 'true' && github.event_name == 'pull_request'
          && hashFiles('govuk-rag-eval/results/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('govuk-rag-eval/results/report.md', 'utf8');
            const marker = '<!-- rag-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }

      - name: Upload artefacts
        if: env.HAS_KEY == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: govuk-rag-eval/results/

      # compare.py exits non-zero on a threshold breach; this step surfaces it
      # after the comment has been posted, so a failing PR still gets its table.
      - name: Enforce gate
        if: env.HAS_KEY == 'true' && steps.compare.outcome == 'failure'
        run: exit 1
