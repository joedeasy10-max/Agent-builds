name: Experiment benchmark

# Build step 7. Runs every config in configs/experiments/ over the SAME corpus
# and golden set, and prints the comparison table.
#
# Manual only. Each config gets its own index — that is the cost of an honest
# comparison, since a shared index would score three of them against vectors
# built for the fourth. Configs whose retriever or embedder cannot run here are
# reported as skipped with the reason, not crashed on.

on:
  workflow_dispatch:
    inputs:
      primary_metric:
        description: "Metric that decides the winner"
        required: true
        default: "mrr"

concurrency:
  group: experiments
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: govuk-rag-eval

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run the benchmark
        run: |
          python scripts/run_experiments.py \
            --dataset data/golden/questions.jsonl \
            --configs configs/experiments/*.yaml \
            --primary-metric ${{ inputs.primary_metric }} \
            --out results/experiments

      - name: Show the table
        if: always()
        run: cat results/experiments/table.md || echo "no table produced"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiments-${{ github.run_id }}
          path: govuk-rag-eval/results/experiments/
          if-no-files-found: warn
