# Experiment: dense retrieval + cross-encoder reranker. One change from baseline.
#
# The reranker stage is not implemented yet. The `reranker:` block below is
# therefore DECLARED, not commented out: Config rejects unknown keys, so this
# config fails to load and the benchmark reports the row as skipped with the
# reason. That is the honest outcome.
#
# It used to carry the reranker commented out, which made this file identical
# to baseline.yaml in every respect that affects retrieval. The benchmark ran
# it and published a row of numbers that were, necessarily, baseline's numbers
# under a different name — an experiment that had not been performed. Deleting
# the comment markers is what turns it back into a real, pending experiment.
seed: 42
corpus:
  source: govuk
  search_query: "self assessment self employment"
  max_pages: 300
  request_delay_seconds: 1.0
  raw_dir: data/corpus/raw
  manifest_path: data/corpus/manifest.json
chunking:
  splitter: recursive
  chunk_size: 512
  chunk_overlap: 64
  separators: ["\n\n", "\n", ". ", " ", ""]
embedding:
  # Matches the active config. These were written against OpenAI before the
  # project moved to a local embedder; comparing configs on an embedder the
  # project no longer uses would benchmark something nobody runs.
  provider: bge
  model: BAAI/bge-small-en-v1.5
  dimensions: 384
  batch_size: 64
store:
  type: flat
  path: .index
retrieval:
  retriever: dense
  top_k: 5
  normalize: true
reranker:                # <-- lands in a later build step; unknown key today
  model: BAAI/bge-reranker-base
  top_n: 5
