# Experiment: dense + BM25 hybrid retrieval. One change from baseline.
# NOTE: requires the `hybrid` retriever, which is not implemented in build
# step 1 (dense only). This config is scaffolding for build step 7; running it
# now raises NotImplementedError by design until the retriever lands.
seed: 42
corpus:
  source: govuk
  search_query: "self assessment self employment"
  max_pages: 300
  request_delay_seconds: 1.0
  raw_dir: data/corpus/raw
  manifest_path: data/corpus/manifest.json
chunking:
  splitter: recursive
  chunk_size: 512
  chunk_overlap: 64
  separators: ["\n\n", "\n", ". ", " ", ""]
embedding:
  # Matches the active config. These were written against OpenAI before the
  # project moved to a local embedder; comparing configs on an embedder the
  # project no longer uses would benchmark something nobody runs.
  provider: bge
  model: BAAI/bge-small-en-v1.5
  dimensions: 384
  batch_size: 64
store:
  type: flat
  path: .index
retrieval:
  retriever: hybrid      # <-- the one change (needs later-step support)
  top_k: 5
  normalize: true
