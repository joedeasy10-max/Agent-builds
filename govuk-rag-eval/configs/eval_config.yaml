# Which metrics gate a PR, and how much movement is tolerated.
#
# Two ideas do the work here:
#   absolute_floor  - the metric may never drop below this, full stop.
#   max_relative_drop - how far it may fall vs. the baseline on main before
#                       the build fails. Judge metrics get a wider band
#                       because LLM graders are noisy run-to-run.

dataset:
  path: data/golden/questions.jsonl
  version: v2           # bump on every change to the golden set
  # v2 is the first reviewed golden set (build step 3): 65 records — 41
  # answerable across 21 GOV.UK pages, 24 negatives. Drafted by Claude from the
  # pinned corpus, then accepted or rejected by a human; nothing reaches this
  # file unreviewed. Any baseline taken on v1 is not comparable and must be
  # regenerated.
  #
  # (This comment said 67/43 until the counts were re-derived from the file:
  # PR #16 dropped two self-referential questions and the comment was not
  # updated with them. Counting is one line — `wc -l data/golden/questions.jsonl`
  # — so prefer that over trusting this sentence.)
  # A baseline is only comparable within the same dataset version.
  # compare.py refuses to gate across versions and warns instead.

suites:
  retrieval:
    gating: true        # deterministic, zero variance — safe to gate hard
    metrics:
      hit_at_5:
        absolute_floor: 0.82
        max_relative_drop: 0.02
      mrr:
        absolute_floor: 0.65
        max_relative_drop: 0.03
      context_recall_at_10:
        absolute_floor: 0.88
        max_relative_drop: 0.02
      # Recall within the context actually served (retrieval.top_k). The metrics
      # above are measured at fixed cutoffs and so cannot see a top_k change;
      # this one can. Floor mirrors hit_at_5 because, with one gold chunk per
      # question, the two coincide at the current top_k of 5 — they diverge the
      # moment top_k moves, which is the point.
      served_context_recall:
        absolute_floor: 0.82
        max_relative_drop: 0.02

  judge:
    gating: true
    runs: 3             # median of N runs, to damp judge variance
    # The tolerances below were GUESSES (0.05/0.05/0.06) until the spread was
    # measured on run 34505214155 — 41 questions x 3 runs, anthropic/
    # claude-sonnet-5. They are now derived from that measurement. The rule is
    # that max_relative_drop must sit above the noise floor, or the gate fails
    # on variance rather than on regressions.
    #
    #   metric              median   spread     rel   old tol   new tol
    #   faithfulness        0.9502   0.0318   3.35%      5%        8%
    #   answer_relevancy    0.8992   0.0012   0.14%      5%        2%
    #   context_precision   0.8197   0.0187   2.28%      6%        5%
    #   answer_correctness  0.8305   0.0119   1.43%      —    ungated
    #
    # Full run values live in results/baseline.json under judge_spread.
    metrics:
      faithfulness:
        absolute_floor: 0.85
        # Widened from 0.05 — for margin, not because 5% was breached.
        # Being precise about that, since it is easy to overstate: nothing
        # observed would have failed at 5%. The worst plausible
        # median-to-median drop, taking the highest run value as a baseline
        # and the lowest as a later run, is
        #     (0.9756 - 0.9438) / 0.9756 = 3.26%
        # which passes 5% but consumes 65% of the budget. The median also
        # moved 2.5% between two independent 3-run measurements (0.975 on run
        # 34498691301, 0.950 on 34505214155), so a real regression would have
        # roughly a third of the band left to show up in before this metric
        # is fighting its own noise. 8% takes budget usage down to 41%.
        #
        # The better fix is more runs — median-of-3 is thin for this metric
        # specifically, and the median moving between measurements is the
        # symptom. That costs about $1.20 per extra run, so widening the band
        # is a deliberate cost trade, not a conclusion that 3 runs suffice.
        max_relative_drop: 0.08
      answer_relevancy:
        absolute_floor: 0.80
        # TIGHTENED from 0.05. Measured spread is 0.14% — this metric is
        # remarkably stable across runs, and a 5% band was so loose it could
        # not have caught any realistic regression. 2% is still ~14x the
        # observed noise, which is deliberately conservative: three samples is
        # a thin basis for tightening, so this leaves room for the estimate to
        # be wrong rather than cutting to the measurement.
        max_relative_drop: 0.02
      context_precision:
        absolute_floor: 0.70
        # Tightened from 0.06. Measured spread 2.28%; 5% keeps ~2.2x headroom.
        max_relative_drop: 0.05
      # Reported but never gated. The stated reason was "too noisy to be a
      # build signal" — the measurement does not support that: at 1.43% it is
      # less noisy than faithfulness or context_precision. The real reason to
      # keep it ungated is that it scores an answer against a hand-written
      # ground_truth string, so it measures agreement with one phrasing rather
      # than correctness. Left ungated on that basis, not on noise.
      answer_correctness:
        gating: false

reporting:
  # Flag any single question that regressed sharply, even if the aggregate
  # held. Aggregate metrics hide narrow but real failures.
  per_question_alert_threshold: 0.30
  worst_examples_in_comment: 5

cost:
  # Guardrails so a runaway loop can't drain the key.
  max_judge_questions_per_run: 120
  max_usd_per_run: 4.00
