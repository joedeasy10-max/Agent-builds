# Which metrics gate a PR, and how much movement is tolerated.
#
# Two ideas do the work here:
#   absolute_floor  - the metric may never drop below this, full stop.
#   max_relative_drop - how far it may fall vs. the baseline on main before
#                       the build fails. Judge metrics get a wider band
#                       because LLM graders are noisy run-to-run.

dataset:
  path: data/golden/questions.jsonl
  version: v2           # bump on every change to the golden set
  # v2 is the first reviewed golden set (build step 3): 65 records — 41
  # answerable across 21 GOV.UK pages, 24 negatives. Drafted by Claude from the
  # pinned corpus, then accepted or rejected by a human; nothing reaches this
  # file unreviewed. Any baseline taken on v1 is not comparable and must be
  # regenerated.
  #
  # (This comment said 67/43 until the counts were re-derived from the file:
  # PR #16 dropped two self-referential questions and the comment was not
  # updated with them. Counting is one line — `wc -l data/golden/questions.jsonl`
  # — so prefer that over trusting this sentence.)
  # A baseline is only comparable within the same dataset version.
  # compare.py refuses to gate across versions and warns instead.

suites:
  retrieval:
    gating: true        # deterministic, zero variance — safe to gate hard
    metrics:
      hit_at_5:
        absolute_floor: 0.82
        max_relative_drop: 0.02
      mrr:
        absolute_floor: 0.65
        max_relative_drop: 0.03
      context_recall_at_10:
        absolute_floor: 0.88
        max_relative_drop: 0.02
      # Recall within the context actually served (retrieval.top_k). The metrics
      # above are measured at fixed cutoffs and so cannot see a top_k change;
      # this one can. Floor mirrors hit_at_5 because, with one gold chunk per
      # question, the two coincide at the current top_k of 5 — they diverge the
      # moment top_k moves, which is the point.
      served_context_recall:
        absolute_floor: 0.82
        max_relative_drop: 0.02

  judge:
    gating: true
    # 1, not 3 — and this is not a cost saving, it is a correctness point.
    # `--runs N` re-runs the GRADER over answers that were generated once, so
    # under a deterministic grader every pass returns the same number and
    # judge_spread in the results is structurally 0.0000. Median-of-N damped
    # RAGAS's grader noise; it never damped generation noise, under either
    # grader. Raising this buys nothing but grading time.
    runs: 1

    # Grader: LOCAL NLI ENTAILMENT (cross-encoder/nli-deberta-v3-small).
    #
    # The floors and bands below were re-derived from scratch for this grader.
    # They had to be: the previous set was calibrated on RAGAS, which scores the
    # same system on a different scale — faithfulness 0.950 under RAGAS is
    # 0.689 under NLI. Carrying the old faithfulness floor of 0.85 across would
    # have failed the gate on the very first run, on a system that had not
    # regressed at all. (A test now catches exactly that: promote a baseline,
    # gate the same run against it, and require a pass.)
    #
    # WHERE THE NOISE COMES FROM. The grader is deterministic. The generator is
    # not — generation.temperature: 0.0 is honoured by openai and ignored by the
    # Anthropic models in use — so answers differ between runs and the judge
    # metrics move with them. The in-run judge_spread cannot see this, because
    # generation happens before grading. So the bands come from repeated WHOLE
    # runs of the same system: 34618486278 and 34619048854 on ae7dfa2, plus
    # 34616914158 (PR #33), 34620099721 and 34620721195 (PR #35) and
    # 34621223251 (PR #36). None of those commits touched the generator or the
    # grader, so all six measure one system.
    #
    #   metric              mean     sd      sd/mean   band   sigma   was
    #   faithfulness        0.6923  0.0132    1.91%     7%    3.7σ     8%
    #   answer_relevancy    0.8427  0.0036    0.43%     3%    7.0σ     2%
    #   context_precision   0.8091  0.0002    0.02%     2%   >100σ     5%
    #   answer_correctness  0.7869  0.0082    1.04%  ungated   —       —
    #
    # THE RULE, AND WHY IT CHANGED. It used to be "2-3x the widest observed
    # spread". That rule is broken, and it moved faithfulness' band twice for
    # no good reason:
    #
    #   n=3  range 1.70%   sd/mean 0.90%   -> band set to 5%
    #   n=4  range 1.87%   sd/mean 0.85%   -> band widened to 7%
    #   n=5  range 3.98%   sd/mean 1.47%   -> looked "too tight" again
    #   n=6  range 5.06%   sd/mean 1.91%   -> 7% is fine after all
    #
    # The range of a sample can only grow as samples accumulate: it is the max
    # minus the min, so every new run can widen it and none can narrow it. Using
    # it as the noise estimate guarantees the band looks too tight forever, and
    # invites exactly the behaviour the docs forbid — widening whenever a number
    # moves. The standard deviation does not have that bias; it settled around
    # 1.9% and stayed there.
    #
    # So: BAND >= 3 SIGMA OF THE RUN-TO-RUN MEAN, and never below 2% regardless.
    # 3σ is the conventional "will not fire on noise" threshold, and unlike a
    # multiple of the range it does not drift with how many runs you happen to
    # have. Every band above already satisfies it; none needs changing. Recheck
    # the sd as runs accumulate — but recheck, do not reflexively widen.
    #
    # NOTE that answer_relevancy moved the WRONG WAY when these were first set:
    # 2% -> 3%. Its 2% band was calibrated against RAGAS's 0.14% noise, and this
    # grader's generation-driven noise is larger, so 2% would have fired on
    # variance. Widening it was the honest result of the measurement.
    #
    # The real fix for faithfulness' 1.9% is not a wider band but a determinate
    # generator: generation.temperature is already 0.0 and openai honours it.
    # Switching generation.provider would make the whole suite reproducible and
    # let these bands be genuinely tight — at the cost of a fresh baseline,
    # since different answers mean different scores. Not done here; noted as the
    # option that actually removes the noise rather than accommodating it.
    metrics:
      faithfulness:
        # Was 0.85, which is a RAGAS-scale number and unreachable here. 0.60
        # sits ~13% below the observed 0.688: a catastrophe backstop (the
        # grader finding most answers unentailed by their contexts), not a
        # quality target. Day-to-day regressions are caught by the band.
        absolute_floor: 0.60
        max_relative_drop: 0.07
      answer_relevancy:
        # Was 0.80. Observed 0.839 left only 4.6% of headroom, less than the
        # band above it, so the floor would have fired before the band ever
        # did. 0.78 restores the intended order: band first, floor as backstop.
        absolute_floor: 0.78
        max_relative_drop: 0.03
      context_precision:
        # Unchanged at 0.70; observed 0.809 keeps ~13% headroom. This metric is
        # scored off the retrieved ranking rather than the answer text, which is
        # why it barely moves between runs (0.03%) and can take the tightest band.
        absolute_floor: 0.70
        max_relative_drop: 0.02
      # Still reported, still ungated, and still for the stated reason: it scores
      # an answer against one hand-written ground_truth phrasing, so it measures
      # agreement with that wording rather than correctness. Not a noise
      # argument — at 2.71% it is in the same range as the metrics that do gate.
      answer_correctness:
        gating: false

reporting:
  # Flag any single question that regressed sharply, even if the aggregate
  # held. Aggregate metrics hide narrow but real failures.
  per_question_alert_threshold: 0.30
  worst_examples_in_comment: 5

cost:
  # Guardrails so a runaway loop can't drain the key.
  max_judge_questions_per_run: 120
  max_usd_per_run: 4.00
