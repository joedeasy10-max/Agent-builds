# Pinned dependencies. An eval harness whose numbers move because a transitive
# dependency bumped is not an eval harness (BUILD.md). Bump deliberately, in a
# PR, and let the gate tell you whether it moved the metrics.
#
# Step 1 (ingest + retrieve) + the gate script. Judge/RAGAS and the real vector
# store are pinned as later steps add them (see BUILD.md build order).

# --- runtime: ingest + retrieve (step 1) ---
numpy==2.4.6
PyYAML==6.0.1
requests==2.33.1
langchain-text-splitters==1.1.2

# --- embedding providers (imported lazily; only the configured one is used) ---
# Required by the active config (embedding.provider: openai). Needs OPENAI_API_KEY.
# Must stay compatible with the httpx that langchain-core pulls in (0.28.x):
# openai 1.51 passed `proxies=` to httpx.Client, which httpx>=0.28 removed.
# 3.3.0 (not a later 3.x): the judge stack's resolver caps it there, and the
# two locks must install together — see requirements-judge.lock.
openai==3.3.0             # provider: openai  (text-embedding-3-small)
# Local embedder (embedding.provider: bge) — no API key, no per-call cost.
# CPU wheels only: this project never needs CUDA, and the default PyPI torch
# bundles multi-GB nvidia-* payloads. PEP 440 sorts `X.Y.Z+cpu` above `X.Y.Z`,
# so adding the CPU index makes pip prefer the CPU build.
--extra-index-url https://download.pytorch.org/whl/cpu
sentence-transformers==6.0.1
# Pinned from the first green CI run (Agent-builds run 34412424071): pip
# resolved torch-2.14.0+cpu-cp312-cp312-manylinux_2_28_x86_64.whl (196 MB, no
# nvidia-* payload) from the CPU index above. download.pytorch.org is
# unreachable from the dev sandbox, so CI is the source of truth for this pin.
torch==2.14.0+cpu

